name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore ImagingResults.sln
      - run: dotnet build ImagingResults.sln --configuration Release --no-restore
      - run: dotnet test ImagingResults.sln --configuration Release --no-build
      - run: dotnet pack ImagingResults.sln --configuration Release --no-build --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
